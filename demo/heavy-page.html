<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Site de démo — page lourde</title>
  <link rel="stylesheet" href="/style.css" />
  <!-- Ces deux scripts doivent être filtrés par le proxy -->
  <script src="https://www.google-analytics.com/analytics.js"></script>
  <script src="https://connect.facebook.net/en_US/fbevents.js"></script>
</head>
<body>
  <h1>Actualités locales — édition du jour</h1>
  <img src="hero.jpg" alt="Photo principale" width="1600" height="1000" />
  <p>Un long article avec plusieurs photos, comme un site de presse ou d'e-commerce typique.</p>
  <img src="photo1.jpg" alt="Photo 1" width="1200" height="800" />
  <p>Encore du texte entre les images...</p>
  <img src="photo2.jpg" alt="Photo 2" width="1200" height="800" />
  <img src="photo3.jpg" alt="Photo 3" width="1200" height="800" />
  <iframe src="https://doubleclick.net/ads/banner"></iframe>

  <div id="api-result">Chargement des données...</div>
  <script>
    // Simule un appel fetch() interne type Next.js (route API relative, racine).
    fetch('/api/data.json')
      .then(r => r.json())
      .then(data => { document.getElementById('api-result').textContent = data.message; })
      .catch(err => { document.getElementById('api-result').textContent = 'ERREUR: ' + err.message; });
  </script>
</body>
</html>
